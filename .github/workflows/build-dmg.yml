name: Zbuduj DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Kompilacja i obraz DMG
        run: bash build.sh dmg

      - name: Plik do pobrania (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LaunchpadClassic-dmg
          path: build/LaunchpadClassic.dmg

      - name: Wydanie z plikiem .dmg (zakładka Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/LaunchpadClassic.dmg \
            --title "Launchpad Classic (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automatyczny build z gałęzi main." --latest
